name: Android Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with build artifacts'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name (if publishing release manually, e.g. v1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version and Create Tag
        id: versioning
        run: |
          git fetch --tags --force

          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            echo "Using existing tag: $TAG_NAME"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG_NAME="${{ inputs.release_tag }}"
            echo "Using input release tag: $TAG_NAME"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            BASE_TAG="v${PKG_VERSION}"

            if git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
              TAG_NAME="${BASE_TAG}.${{ github.run_number }}"
            else
              TAG_NAME="${BASE_TAG}"
            fi

            echo "Generated automatic version tag: $TAG_NAME"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Automated Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_OUTPUT
          CLEAN_VER="${TAG_NAME#v}"
          echo "VERSION_NAME=${CLEAN_VER}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android Keystore (if secrets provided)
        id: setup-keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Android Keystore from secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom keystore secret provided. Release will use configured fallback signing."
            echo "HAS_KEYSTORE=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Build Release App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Prepare and rename build artifacts
        run: |
          mkdir -p artifacts
          
          # Find APK
          APK_SRC=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" artifacts/SplitIt-release.apk
            echo "Copied APK: $APK_SRC -> artifacts/SplitIt-release.apk"
          else
            echo "Warning: No APK found!"
          fi

          # Find AAB
          AAB_SRC=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -f "$AAB_SRC" ]; then
            cp "$AAB_SRC" artifacts/SplitIt-release.aab
            echo "Copied AAB: $AAB_SRC -> artifacts/SplitIt-release.aab"
          else
            echo "Warning: No AAB found!"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitIt-Release-APK
          path: artifacts/SplitIt-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitIt-Release-Bundle
          path: artifacts/SplitIt-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.RELEASE_TAG }}
          name: Release ${{ steps.versioning.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/SplitIt-release.apk
            artifacts/SplitIt-release.aab
