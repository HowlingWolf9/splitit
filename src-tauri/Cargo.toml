[package]
name = "splitit"
version = "1.9.0"
description = "SplitIt - Modern Expense Manager"
authors = ["HowlingWolf9"]
edition = "2021"

[lib]
name = "splitit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
